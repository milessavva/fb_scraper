[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-profile-scraper"
version = "0.1.0"
description = "Collect accessible Facebook profile posts for pandas analysis"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "playwright>=1.48,<2", "python-dateutil>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fb-scraper = "fb_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
